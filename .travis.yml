language: python
python:
  - "2.7"
  - "3.4"
  - "3.6"
  - "3.9"
branches:
  except:
    - piptools-ignore-patch
install:
  - "pip install -U setuptools pip wheel"
  - "pip install cram"
  - "if python --version 2>&1 | grep -q 'Python 2'; then pip install mock; fi"
  - "pip install ."
script:
  - "python -m unittest discover -s tests"
  - "cram --shell=/bin/bash tests/*.t"
